name: Update Syncthing and publish APK

on:
  schedule:
    # Check the official Syncthing releases every six hours.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-syncthing-and-publish
  cancel-in-progress: false

jobs:
  update:
    name: Update main directly
    if: github.repository == 'Realm667/syncthing-android'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      app_tag: ${{ steps.update.outputs.app_tag }}
      syncthing_tag: ${{ steps.latest.outputs.tag }}
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: main
          submodules: true
          fetch-depth: 0

      - name: Find latest published Syncthing release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          RELEASE_JSON=$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/syncthing/syncthing/releases?per_page=20')
          LATEST_TAG=$(echo "${RELEASE_JSON}" | jq -r 'map(select(.draft == false))[0].tag_name // empty')
          if ! echo "${LATEST_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Unexpected or missing Syncthing release tag: ${LATEST_TAG}"
            exit 1
          fi
          echo "tag=${LATEST_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Latest published Syncthing release: ${LATEST_TAG}"

      - name: Update submodule pointer and app version
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -eu
          CURRENT_TAG=$(tr -d '\r\n' < .github/syncthing-release-tag)
          CURRENT_VERSION=$(grep -m1 '^version-name = ' gradle/libs.versions.toml | cut -d '"' -f 2)
          CURRENT_APP_TAG="v${CURRENT_VERSION}"
          if [ "${CURRENT_TAG}" = "${LATEST_TAG}" ]; then
            echo "Syncthing ${LATEST_TAG} is already included."
            if ! git ls-remote --exit-code --tags origin "refs/tags/${CURRENT_APP_TAG}" >/dev/null 2>&1; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git tag --annotate "${CURRENT_APP_TAG}" --message "Syncthing ${LATEST_TAG}"
              git push origin "refs/tags/${CURRENT_APP_TAG}"
              echo "Created missing release tag ${CURRENT_APP_TAG}."
            fi

            RELEASE_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${CURRENT_APP_TAG}")
            if [ "${RELEASE_STATUS}" = '200' ]; then
              echo "GitHub release ${CURRENT_APP_TAG} already exists."
              echo 'changed=false' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            if [ "${RELEASE_STATUS}" != '404' ]; then
              echo "Unexpected GitHub API status while checking ${CURRENT_APP_TAG}: ${RELEASE_STATUS}"
              exit 1
            fi

            echo 'changed=true' >> "${GITHUB_OUTPUT}"
            echo "app_tag=${CURRENT_APP_TAG}" >> "${GITHUB_OUTPUT}"
            echo "Release ${CURRENT_APP_TAG} is missing and will be rebuilt."
            exit 0
          fi

          git -C syncthing/src/github.com/syncthing/syncthing fetch --force origin \
            "refs/tags/${LATEST_TAG}:refs/tags/${LATEST_TAG}"
          git -C syncthing/src/github.com/syncthing/syncthing checkout --detach "${LATEST_TAG}"

          BASE_VERSION=$(echo "${LATEST_TAG#v}" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          CURRENT_BASE=$(echo "${CURRENT_VERSION}" | cut -d '.' -f 1-3)
          CURRENT_BUILD=$(echo "${CURRENT_VERSION}" | cut -d '.' -f 4)

          if [ "${BASE_VERSION}" = "${CURRENT_BASE}" ]; then
            NEW_BUILD=$((CURRENT_BUILD + 1))
          else
            NEW_BUILD=0
          fi
          if [ "${NEW_BUILD}" -gt 99 ]; then
            echo "More than 100 Syncthing releases share base version ${BASE_VERSION}; version scheme exhausted."
            exit 1
          fi

          NEW_VERSION="${BASE_VERSION}.${NEW_BUILD}"
          IFS='.' read -r MAJOR MINOR PATCH BUILD <<EOF
          ${NEW_VERSION}
          EOF
          NEW_VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + BUILD))

          sed -i -E 's/version-name = "[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+"/version-name = "'"${NEW_VERSION}"'"/' gradle/libs.versions.toml
          sed -i -E 's/version-code = "[0-9]+"/version-code = "'"${NEW_VERSION_CODE}"'"/' gradle/libs.versions.toml
          printf '%s\n' "${LATEST_TAG}" > .github/syncthing-release-tag

          APP_TAG="v${NEW_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${APP_TAG}" >/dev/null 2>&1; then
            echo "Release tag ${APP_TAG} already exists; refusing to replace it."
            exit 1
          fi

          git add gradle/libs.versions.toml .github/syncthing-release-tag \
            syncthing/src/github.com/syncthing/syncthing
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Syncthing to ${LATEST_TAG}"

          # Refuse to overwrite concurrent work. Rebase only when it is conflict-free.
          git pull --rebase origin main
          git push origin HEAD:main

          git tag --annotate "${APP_TAG}" --message "Syncthing ${LATEST_TAG}"
          git push origin "refs/tags/${APP_TAG}"

          echo 'changed=true' >> "${GITHUB_OUTPUT}"
          echo "app_tag=${APP_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Updated main and created ${APP_TAG}."

  release:
    name: Build and publish APK
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/release-app.yaml
    with:
      tag: ${{ needs.update.outputs.app_tag }}
      syncthingTag: ${{ needs.update.outputs.syncthing_tag }}
    permissions:
      contents: write
