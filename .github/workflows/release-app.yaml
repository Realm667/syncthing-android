name: Release App

on:
  workflow_call:
    inputs:
      tag:
        description: 'App tag to publish (for example v2.1.4.0)'
        required: true
        type: string
      syncthingTag:
        description: 'Syncthing release included in the app'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing app tag to publish (for example v2.1.4.0)'
        required: true
        type: string
      syncthingTag:
        description: 'Syncthing release included in the app (optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-app-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Ensure tag belongs to main
        run: |
          set -eu
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${{ inputs.tag }} is not part of main - aborting."
            exit 1
          fi

  build:
    name: Build release APK
    needs: prepare
    uses: ./.github/workflows/common-build.yaml
    with:
      applicationId: 'com.github.danielgimmer.syncthingesdesync'
      buildType: 'Release'
      checkoutRef: ${{ inputs.tag }}

  sign:
    name: Sign release APK
    needs: [prepare, build]
    uses: ./.github/workflows/common-sign.yaml
    with:
      applicationId: 'com.github.danielgimmer.syncthingesdesync'
      buildType: 'release'
      environmentName: 'dev-sign-untrusted'
      usePublicTestKey: true

  publish:
    name: Publish GitHub release
    needs: [prepare, sign]
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Download signed APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: syncthing-esde-sync-release-apk
          path: ./artifacts

      - name: Create checksums and release notes
        env:
          REQUESTED_SYNCTHING_TAG: ${{ inputs.syncthingTag }}
        run: |
          set -eu
          cd artifacts
          sha256sum ./*.apk > SHA256SUMS.txt
          cd ..

          SYNCTHING_TAG="${REQUESTED_SYNCTHING_TAG}"
          if [ -z "${SYNCTHING_TAG}" ]; then
            SYNCTHING_TAG=$(git -C syncthing/src/github.com/syncthing/syncthing describe --tags --exact-match HEAD)
          fi

          {
            echo "Syncthing-Fork ES-DE Gaming Sync ${{ inputs.tag }}"
            echo ""
            echo "Enthaltene Syncthing-Version: ${SYNCTHING_TAG}"
            echo ""
            echo "Die APK wurde automatisch mit dem stabilen, öffentlichen Testschlüssel signiert. Sie ist für persönliche Installationen und automatische Updates geeignet, aber kein vertrauenswürdiger Store-/Produktionsbuild."
            echo ""
            echo "Prüfsummen stehen in SHA256SUMS.txt."
          } > "${RUNNER_TEMP}/release-notes.md"

      - name: Create published GitHub release
        uses: ncipollo/release-action@339a81892b84b4bee98b60c0593521ed34d9990e8 # v1.21.0
        with:
          tag: ${{ inputs.tag }}
          artifacts: './artifacts/*'
          artifactErrorsFailBuild: true
          name: Syncthing-Fork ES-DE Sync ${{ inputs.tag }}
          bodyFile: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ contains(inputs.syncthingTag, '-') }}
          draft: false
          allowUpdates: false
